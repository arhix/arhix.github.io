<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Touch Grass</title>
    <!-- Use Tailwind CSS for base resets and utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import a clean, ultra-bold sans-serif font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root{
            --bg:#072a14;
            --text:#e8f5e9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg); 
            color: var(--text);
            margin: 0;
            overflow: hidden;
        }

        .hero-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5vw; 
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .text-go {
            font-weight:900;
            font-size: 28vw;
            line-height: 0.77;
            letter-spacing: -0.04em;
            margin-top: 2vw;
        }

        .text-stacked-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .text-stacked {
            font-weight:800;
            font-size: 14vw;
            line-height: 0.77;
            letter-spacing: -0.04em;
        }

        @media (min-width: 1440px) {
            .hero-container { gap: 24px; }
            .text-go { font-size: 400px; }
            .text-stacked { font-size: 200px; }
        }
        
        @media (max-width: 600px) {
            .hero-container { gap: 3vw; }
            .text-go { font-size: 40vw; }
            .text-stacked { font-size: 20vw; }
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center select-none">

    <main class="hero-container">
        <div class="text-go uppercase">GO</div>
        <div class="text-stacked-container">
            <div class="text-stacked lowercase">touch</div>
            <div class="text-stacked lowercase">grass</div>
        </div>
    </main>

</body>
</html>
