<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Touch Grass</title>
    <!-- Use Tailwind CSS for base resets and utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import a clean, ultra-bold sans-serif font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Clean, bold sans-serif font */
            font-family: 'Inter', sans-serif;
            /* Dark green background */
            background-color: #0b2e13; 
            /* Very light green text color */
            color: #e8f5e9; 
            margin: 0;
            overflow: hidden; /* Prevent scrolling since it's a centered placeholder */
        }

        .hero-container {
            display: flex;
            align-items: center;
            justify-content: center;
            /* Small gap between "GO" and the stacked text */
            gap: 1.5vw; 
            /* Add a subtle drop shadow for depth */
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Responsive typography using viewport width (vw) units 
           so it scales perfectly on all devices */
        .text-go {
            /* Gigantic text */
            font-size: 28vw;
            /* Tight line height to align properly with the stacked text */
            line-height: 0.77;
            letter-spacing: -0.04em;
            margin-top: -2vw; /* Optical alignment adjustment */
        }

        .text-stacked-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .text-stacked {
            /* Exactly half the size of "GO" (14vw is half of 28vw) */
            font-size: 14vw;
            line-height: 0.77;
            letter-spacing: -0.04em;
        }

        /* Cap the maximum size for very large desktop screens to prevent it from getting too massive */
        @media (min-width: 1440px) {
            .hero-container { gap: 24px; }
            .text-go { font-size: 400px; margin-top: -24px; }
            .text-stacked { font-size: 200px; }
        }
        
        /* Adjustments for mobile screens to ensure it fits the width */
        @media (max-width: 600px) {
            .hero-container { gap: 3vw; }
            .text-go { font-size: 40vw; margin-top: -2vw; }
            .text-stacked { font-size: 20vw; }
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center select-none">
    
    <main class="hero-container">
        <!-- Gigantic 'GO' -->
        <div class="text-go uppercase">
            GO
        </div>
        
        <!-- Stacked 'touch grass' -->
        <div class="text-stacked-container">
            <div class="text-stacked lowercase">touch</div>
            <div class="text-stacked lowercase">grass</div>
        </div>
    </main>

</body>
</html>
